services:
  smartbot:
    build: .
    container_name: smartbot-app
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=production
      - PORT=8000
      - MONGODB_URI=${MONGODB_URI}
      - PROJECT_ID=${PROJECT_ID}
      - API_KEYS=${API_KEYS}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/dialogflow_key
    secrets:
      - dialogflow_key
    # Hardening: read-only filesystem, no extra Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  dialogflow_key:
    file: ./dialogflow/agent-key.json